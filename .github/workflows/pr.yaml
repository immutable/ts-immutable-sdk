name: PR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  merge_group:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  syncpack:
    name: Syncpack
    runs-on: ubuntu-latest-4-cores
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Syncpack
        shell: bash
        run: pnpm syncpack:check

  build-lint-test-sdk:
    name: Build, Lint & Test SDK
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.TS_IMMUTABLE_SDK_NX_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build, Lint & Test
        shell: bash
        run: pnpm --if-present nx affected -t build,lint,test

  should-run-functional-tests:
    name: Determine whether functional tests are needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should-run: ${{ steps.changed-files.outputs.should-run }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files
        id: changed-files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: |
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qv '^packages/audience/'; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  func-tests:
    name: Functional tests
    if: needs.should-run-functional-tests.outputs.should-run == 'true'
    needs: should-run-functional-tests
    runs-on: ubuntu-latest-8-cores
    permissions:
      contents: read
    env:
      NX_CLOUD_ACCESS_TOKEN: ${{ secrets.TS_IMMUTABLE_SDK_NX_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # pin@v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: setup
        uses: ./.github/actions/setup

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build SDK
        shell: bash
        run: pnpm build

      - name: Prepare SDK
        shell: bash
        run: pnpm prepare:sdk

      - name: Prepare tests
        shell: bash
        run: pnpm prepare:tests

      - name: Update modules
        shell: bash
        run: pnpm install --frozen-lockfile=false --ignore-scripts

      - name: Run functional tests
        shell: bash
        env:
          ZKEVM_ORDERBOOK_BANKER: ${{ secrets.ZKEVM_ORDERBOOK_BANKER }}
          ZKEVM_ORDERBOOK_ERC20: "0x70dCEF6C22F50497eafc77D252E8E175af21bF75"
          ZKEVM_ORDERBOOK_ERC721: "0xBE8B131f39825282Ace9eFf99C0Bb14972417b49"
          ZKEVM_ORDERBOOK_ERC1155: "0x2efB9B7810B1d1520c0822aa20F1889ABd2c2146"
          SEAPORT_CONTRACT_ADDRESS: "0x7d117aA8BD6D31c4fa91722f246388f38ab1942c"
          ZONE_CONTRACT_ADDRESS: "0x1004f9615E79462c711Ff05a386BdbA91a7628C3"
          ZKEVM_RPC_ENDPOINT: "https://rpc.testnet.immutable.com"
          ORDERBOOK_MR_API_URL: "https://api.sandbox.immutable.com"
          ZKEVM_CHAIN_NAME: "imtbl-zkevm-testnet"
        run: pnpm --filter "@tests/func-tests-zkevm" --parallel func-test:ci
