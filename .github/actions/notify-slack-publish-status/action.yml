---
name: "Notify Slack Publish Status"
description: "Notify Slack with the completion status of the publish action"
inputs:
  webhook:
    description: "Slack incoming webhook URL"
    required: true
  message:
    description: "Message to send to Slack"
    required: true
    default: ""
runs:
  using: "composite"
  steps:
    - name: Post message to Slack
      shell: bash
      env:
        WEBHOOK: ${{ inputs.webhook }}
        MESSAGE: ${{ inputs.message }}
      run: |
        set -euo pipefail

        payload=$(jq -n --arg text "$MESSAGE" '{
          text: $text,
          blocks: [{ type: "section", text: { type: "mrkdwn", text: $text } }]
        }')

        status=$(curl -sS -o /tmp/slack-response.txt -w "%{http_code}" \
          -X POST \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "$WEBHOOK") || {
          echo "::error::Failed to post message to Slack"
          exit 1
        }

        if [[ "$status" != "200" ]]; then
          echo "::error::Failed to post message to Slack. Status: $status"
          exit 1
        fi

        echo "Posted message to Slack successfully"
